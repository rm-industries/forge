# Native Forge validation. GitHub owns production deployments and release automation.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
default:
  interruptible: true
stages:
  - validate
  - build
  - verify
  - deploy
  - smoke
include:
  - local: .gitlab/ci/setup.yml
  - local: .gitlab/ci/project.yml
  - local: .gitlab/ci/content-model.yml
  - local: .gitlab/ci/markdownlint-frontmatter.yml
  - local: .gitlab/ci/browser-oxfmt.yml
  - local: .gitlab/ci/create-forge.yml
  - local: .gitlab/ci/template.yml
  - local: .gitlab/ci/integration.yml
  - local: .gitlab/ci/website.yml
