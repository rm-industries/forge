# Native Forge validation. GitHub owns production deployments and release automation.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
default:
  interruptible: true
stages:
  - prepare
  - validate
  - build
  - verify
  - deploy
  - smoke
select-impact:
  rules:
    - when: on_success
  image: node:26
  stage: prepare
  variables:
    GIT_DEPTH: '0'
  script:
    - npm ci
    - node .gitlab/ci/select.ts
  artifacts:
    paths:
      - .gitlab-child.json
    expire_in: 1 day
mirror-validation:
  rules:
    - when: on_success
  stage: validate
  needs:
    - select-impact
  trigger:
    include:
      - artifact: .gitlab-child.json
        job: select-impact
    strategy: mirror
