project-format:
  rules:
    - when: on_success
  script:
    - npm run format
  extends: .node
project-lint-code:
  rules:
    - when: on_success
  script:
    - mkdir -p test-results
    - npm run lint:code --silent -- --format gitlab > test-results/code-quality.json
  artifacts:
    paths:
      - test-results/code-quality.json
    when: always
    expire_in: 7 days
    reports:
      codequality: test-results/code-quality.json
  extends: .node
project-lint-markdown:
  rules:
    - when: on_success
  script:
    - npm run lint:markdown
  extends: .node
project-spellcheck:
  rules:
    - when: on_success
  script:
    - npm run spellcheck
  extends: .node
project-documentation:
  rules:
    - when: on_success
  script:
    - npm run docs:validate
  extends: .node
project-typecheck:
  rules:
    - when: on_success
  script:
    - npx tsc --noEmit
  extends: .node
project-test:
  rules:
    - when: on_success
  script:
    - npm run test:contracts
  artifacts:
    paths:
      - test-results/unit.xml
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/unit.xml
  extends: .node
