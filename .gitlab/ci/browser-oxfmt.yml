.browser-oxfmt:
  extends: .node
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - changes:
        - packages/browser-oxfmt/**/*
        - package.json
        - package-lock.json
        - tsconfig.json
        - tsconfig.verification.json
        - .github/actions/setup-project/action.yml
        - .github/workflows/browser-oxfmt.yml
        - .gitlab-ci.yml
        - .gitlab/ci/setup.yml
        - .gitlab/ci/browser-oxfmt.yml
browser-oxfmt-package:
  extends:
    - .browser-oxfmt
    - .native
  script:
    - mkdir -p .ci-browser
    - |
      npm run build:native --workspace @rm-industries/browser-oxfmt -- --force
      cp packages/browser-oxfmt/src/generated/identity.json "$CI_PROJECT_DIR/.ci-browser/first-identity.json"
      cp packages/browser-oxfmt/NOTICE.md "$CI_PROJECT_DIR/.ci-browser/first-NOTICE.md"
      npm run build:native --workspace @rm-industries/browser-oxfmt -- --force
      cmp "$CI_PROJECT_DIR/.ci-browser/first-identity.json" packages/browser-oxfmt/src/generated/identity.json
      cmp "$CI_PROJECT_DIR/.ci-browser/first-NOTICE.md" packages/browser-oxfmt/NOTICE.md
    - npm run quality:native --workspace @rm-industries/browser-oxfmt
    - |
      npm run typecheck --workspace @rm-industries/browser-oxfmt
      npm test --workspace @rm-industries/browser-oxfmt -- --reporter=default --reporter=junit --outputFile=test-results/unit.xml
      npm run build --workspace @rm-industries/browser-oxfmt
    - |
      npx playwright install --with-deps chromium firefox webkit
      npm run test:browser --workspace @rm-industries/browser-oxfmt
    - |
      mkdir -p "$CI_PROJECT_DIR/.ci-browser/forge-packages"
      npm pack --ignore-scripts --workspace @rm-industries/browser-oxfmt --pack-destination "$CI_PROJECT_DIR/.ci-browser/forge-packages"
      for entry in dist/index.js dist/index.d.ts dist/build.js dist/build.d.ts dist/worker.js dist/generated/engine.js dist/generated/engine_bg.wasm dist/generated/identity.json NOTICE.md LICENSE; do
        tar -tzf "$CI_PROJECT_DIR/.ci-browser/forge-packages/"*.tgz | grep -Fx "package/$entry"
      done
  artifacts:
    expire_in: 7 days
    paths:
      - .ci-browser/forge-packages/*.tgz
      - packages/browser-oxfmt/test-results
    when: always
    reports:
      junit: packages/browser-oxfmt/test-results/unit.xml
browser-oxfmt-runtime:
  extends:
    - .browser-oxfmt
    - .runtime
  stage: verify
  needs:
    - job: browser-oxfmt-package
      artifacts: true
  script:
    - |
      mkdir -p "$CI_PROJECT_DIR/.ci-browser/browser-oxfmt"
      tar -xzf "$CI_PROJECT_DIR/.ci-browser/forge-packages/"*.tgz --strip-components=1 -C "$CI_PROJECT_DIR/.ci-browser/browser-oxfmt"
      cp -R "$CI_PROJECT_DIR/.ci-browser/browser-oxfmt/dist/generated" packages/browser-oxfmt/src/generated
      cp "$CI_PROJECT_DIR/.ci-browser/browser-oxfmt/NOTICE.md" packages/browser-oxfmt/NOTICE.md
    - |
      npm run typecheck --workspace @rm-industries/browser-oxfmt
      npm test --workspace @rm-industries/browser-oxfmt -- --reporter=default --reporter=junit --outputFile=test-results/unit.xml
    - |
      mkdir -p "$CI_PROJECT_DIR/.ci-browser/browser-oxfmt-check"
      tar -xzf "$CI_PROJECT_DIR/.ci-browser/forge-packages/"*.tgz --strip-components=1 -C "$CI_PROJECT_DIR/.ci-browser/browser-oxfmt-check"
      ln -s "$CI_PROJECT_DIR/node_modules" "$CI_PROJECT_DIR/.ci-browser/browser-oxfmt-check/node_modules"
      node --input-type=module -e 'await import(process.argv[1])' "$CI_PROJECT_DIR/.ci-browser/browser-oxfmt-check/dist/index.js"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - packages/browser-oxfmt/test-results/unit.xml
    reports:
      junit: packages/browser-oxfmt/test-results/unit.xml
