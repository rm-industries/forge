---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /templates/default
    schedule:
      interval: weekly
      day: monday
      time: '05:10'
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      generated-project-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:20'
      timezone: UTC
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /templates/default
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: UTC
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      generated-production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      generated-development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
