---
name: Repository Automation Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
      - 'templates/default/.github/**'
      - 'packages/create-forge/scripts/**'
      - 'packages/create-forge/src/**'
      - 'packages/create-forge/*.config.ts'
      - 'packages/create-forge/tsconfig.json'
      - 'tsconfig.json'
      - '**/package.json'
      - '**/package-lock.json'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'templates/default/.github/**'
      - 'packages/create-forge/scripts/**'
      - 'packages/create-forge/src/**'
      - 'packages/create-forge/*.config.ts'
      - 'packages/create-forge/tsconfig.json'
      - 'tsconfig.json'
      - '**/package.json'
      - '**/package-lock.json'
  schedule:
    - cron: '43 5 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Workflow security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Generate consumer workflows for validation
        run: |
          npm run build --workspace @rm-industries/create-forge
          node packages/create-forge/dist/index.mjs .ci-review-fixture --yes --no-install --no-git --ci-providers github,gitlab

      - name: Scan workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: true
          collect: all
          inputs: .github .ci-review-fixture/.github

  syntax:
    name: Workflow syntax
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Generate consumer workflows for validation
        run: |
          npm run build --workspace @rm-industries/create-forge
          node packages/create-forge/dist/index.mjs .ci-review-fixture --yes --no-install --no-git --ci-providers github,gitlab

      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          files: '.github/workflows/*.yml,.ci-review-fixture/.github/workflows/*.yml'
