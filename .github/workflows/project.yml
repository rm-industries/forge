---
name: Project Continuous Integration

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Tool Format
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Check formatting
        run: npm run format

  lint-code:
    name: Tool Lint code
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Lint code
        run: npm run lint:code

  lint-markdown:
    name: Tool Lint Markdown
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Lint Markdown
        run: npm run lint:markdown

  spellcheck:
    name: Tool Spellcheck
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Spellcheck
        run: npm run spellcheck

  documentation:
    name: Tool Documentation links and commands
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Check documentation links and commands
        run: npm run docs:validate

  typecheck:
    name: Tool Type-check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Type-check TypeScript
        run: npm run typecheck

  test:
    name: Tool Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Run tests
        run: npm test

  build:
    name: Tool Build
    needs:
      - format
      - lint-code
      - lint-markdown
      - spellcheck
      - documentation
      - typecheck
      - test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Build packages
        run: npm run build

  pack:
    name: Tool Pack
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Inspect package contents
        run: npm run pack

  dependency-audit:
    name: Tool Dependency audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Audit root and workspace dependencies
        id: audit
        continue-on-error: true
        run: npm run audit

      - name: Report dependency audit
        if: steps.audit.outcome == 'failure'
        run: |
          echo '::warning title=Dependency security findings::Review Dependabot alerts and the audit output. Dependency findings are reported here but do not block pull-request remediation.'
          echo '## Dependency security findings' >> "$GITHUB_STEP_SUMMARY"
          echo 'The root dependency audit found blocking-severity advisories. Review the audit output and Dependabot alerts. Release security gates remain blocking.' >> "$GITHUB_STEP_SUMMARY"

  compatibility:
    name: Tool Compatibility (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: '22.22.2'
          - runtime: latest Node 22
            node-version: '22.x'
          - runtime: latest Node 24
            node-version: '24.x'
          - runtime: latest Node 26
            node-version: '26.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate packages on supported runtime
        run: npm run typecheck && npm test && npm run build
