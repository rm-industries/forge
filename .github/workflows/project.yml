name: Project Continuous Integration
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions: {}
concurrency:
  group: "${{ github.workflow_ref }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run quality
        run: "npm run pipeline -- 'quality'"
        continue-on-error: false
  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run audit
        run: "npm run pipeline -- 'audit'"
        continue-on-error: true
  templateStatic:
    name: templateStatic
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run templateStatic
        run: "npm run pipeline -- 'templateStatic'"
        continue-on-error: false
  templateCoverage:
    name: templateCoverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run templateCoverage
        run: "npm run pipeline -- 'templateCoverage'"
        continue-on-error: false
      - if: "always()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: templateCoverage
          path: .zuke/evidence/templateCoverage
          include-hidden-files: "true"
          if-no-files-found: ignore
          retention-days: "7"
  templateBrowser:
    name: templateBrowser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run templateBrowser
        run: "npm run pipeline -- 'templateBrowser'"
        continue-on-error: false
      - if: "always()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: templateBrowser
          path: .zuke/evidence/templateBrowser
          include-hidden-files: "true"
          if-no-files-found: ignore
          retention-days: "7"
  templateLighthouse:
    name: templateLighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run templateLighthouse
        run: "npm run pipeline -- 'templateLighthouse'"
        continue-on-error: false
      - if: "always()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: templateLighthouse
          path: .zuke/evidence/templateLighthouse
          include-hidden-files: "true"
          if-no-files-found: ignore
          retention-days: "7"
  templateAudit:
    name: templateAudit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run templateAudit
        run: "npm run pipeline -- 'templateAudit'"
        continue-on-error: true
  templateStandalone:
    name: templateStandalone
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run templateStandalone
        run: "npm run pipeline -- 'templateStandalone'"
        continue-on-error: false
  generatorE2e:
    name: generatorE2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run generatorE2e
        run: "npm run pipeline -- 'generatorE2e'"
        continue-on-error: false
  ciCheck:
    name: ciCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run ciCheck
        run: "npm run pipeline -- 'ciCheck'"
        continue-on-error: false
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.22.2
          - "22"
          - "24"
          - "26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
      - run: npm ci
      - name: Run compatibility
        run: "npm run pipeline -- 'compatibility'"
  templateCompatibility:
    name: templateCompatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.22.2
          - "22"
          - "24"
          - "26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
      - run: npm ci
      - name: Run templateCompatibility
        run: "npm run pipeline -- 'templateCompatibility'"
  generatorCompatibility:
    name: generatorCompatibility
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.22.2
          - "22"
          - "24"
          - "26"
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
      - run: npm ci
      - name: Run generatorCompatibility
        run: "npm run pipeline -- 'generatorCompatibility'"
  project:
    name: Project
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - quality
      - audit
      - templateCompatibility
      - templateStatic
      - templateCoverage
      - templateBrowser
      - templateLighthouse
      - templateAudit
      - templateStandalone
      - generatorE2e
      - generatorCompatibility
      - ciCheck
    steps:
      - run: "true"
