---
name: Project Continuous Integration
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  impact:
    name: Select validation impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project: ${{ steps.impact.outputs.project }}
      generator: ${{ steps.impact.outputs.generator }}
      website: ${{ steps.impact.outputs.website }}
      packages: ${{ steps.impact.outputs.packages }}
      native: ${{ steps.impact.outputs.native }}
      frontmatterCandidate: ${{ steps.impact.outputs.frontmatterCandidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: impact
        uses: $/.github/actions/ci-impact
  format:
    name: Tool Format
    needs: [impact]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
      - name: Check formatting
        run: npm run format
  lint-code:
    name: Tool Lint code
    needs: [impact]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
      - name: Lint code
        run: npm run lint:code -- --format github
  lint-markdown:
    name: Tool Lint Markdown
    needs: [impact]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
      - name: Lint Markdown
        run: npm run lint:markdown
  spellcheck:
    name: Tool Spellcheck
    needs: [impact]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
      - name: Spellcheck
        run: npm run spellcheck
  documentation:
    name: Tool Documentation links and commands
    needs: [impact]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
      - name: Check documentation links and commands
        run: npm run docs:validate
  typecheck:
    name: Tool Type-check
    needs: [impact]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Report unaffected validation
        if: needs.impact.outputs.project == 'false'
        run: echo 'This validation is unaffected by the complete change set.'
      - name: Checkout repository
        if: needs.impact.outputs.project == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        if: needs.impact.outputs.project == 'true'
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
      - name: Type-check TypeScript
        if: needs.impact.outputs.project == 'true'
        run: npm run typecheck:root
  test:
    name: Tool Test
    needs: [impact]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Report unaffected validation
        if: needs.impact.outputs.project == 'false'
        run: echo 'This validation is unaffected by the complete change set.'
      - name: Checkout repository
        if: needs.impact.outputs.project == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        if: needs.impact.outputs.project == 'true'
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
      - name: Run tests
        if: needs.impact.outputs.project == 'true'
        run: npm run test:root
  native:
    name: Tool Rust quality
    needs: [impact]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.native }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Report unaffected validation
        if: needs.impact.outputs.native == 'false'
        run: echo 'This validation is unaffected by the complete change set.'
      - name: Checkout repository
        if: needs.impact.outputs.native == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        if: needs.impact.outputs.native == 'true'
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
          native: 'true'
      - name: Check Rust formatting and Clippy
        if: needs.impact.outputs.native == 'true'
        run: npm run quality:native --workspace @rm-industries/browser-oxfmt
  build:
    name: Tool Build
    needs:
      - impact
      - format
      - lint-code
      - lint-markdown
      - spellcheck
      - documentation
      - typecheck
      - test
      - native
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Report unaffected validation
        if: needs.impact.outputs.project == 'false'
        run: echo 'This validation is unaffected by the complete change set.'
      - name: Checkout repository
        if: needs.impact.outputs.project == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        if: needs.impact.outputs.project == 'true'
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
          native: ${{ needs.impact.outputs.native }}
      - name: Build packages
        if: needs.impact.outputs.project == 'true'
        env:
          PACKAGES: ${{ needs.impact.outputs.packages }}
        run: |-
          for package in $PACKAGES; do npm run build --workspace "@rm-industries/$package"; done
      - name: Package tested candidates without repeating prepack
        if: needs.impact.outputs.project == 'true'
        env:
          PACKAGES: ${{ needs.impact.outputs.packages }}
        run: |-
          mkdir -p "$RUNNER_TEMP/forge-packages"
          for package in $PACKAGES; do
            npm pack --ignore-scripts --workspace "@rm-industries/$package" --pack-destination "$RUNNER_TEMP/forge-packages"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.impact.outputs.project == 'true'
        with:
          name: project-packages
          path: ${{ runner.temp }}/forge-packages/*.tgz
          if-no-files-found: error
          retention-days: 7
  pack:
    name: Tool Pack
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - impact
      - build
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Report unaffected validation
        if: needs.impact.outputs.project == 'false'
        run: echo 'This validation is unaffected by the complete change set.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.impact.outputs.project == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.impact.outputs.project == 'true'
        with:
          name: project-packages
          path: ${{ runner.temp }}/forge-packages
      - name: Inspect published package contents
        if: needs.impact.outputs.project == 'true'
        run: |
          for candidate in "$RUNNER_TEMP/forge-packages/"*.tgz; do
            tar -tzf "$candidate"
            case "$candidate" in
              *content-model*.tgz)
                for entry in index astro sveltia; do
                  tar -tzf "$candidate" | grep -Fx "package/dist/$entry.js"
                  tar -tzf "$candidate" | grep -Fx "package/dist/$entry.d.ts"
                done
                ;;
              *browser-oxfmt*.tgz)
                for entry in dist/index.js dist/index.d.ts dist/worker.js dist/generated/engine.js dist/generated/engine_bg.wasm dist/generated/identity.json NOTICE.md LICENSE; do
                  tar -tzf "$candidate" | grep -Fx "package/$entry"
                done
                ;;
              *markdownlint-frontmatter*.tgz)
                tar -tzf "$candidate" | grep -Fx 'package/dist/index.js'
                tar -tzf "$candidate" | grep -Fx 'package/dist/index.d.ts'
                ;;
              *create-forge*.tgz)
                tar -tzf "$candidate" | grep -Fx 'package/dist/index.mjs'
                tar -tzf "$candidate" | grep -Fx 'package/dist/template/package-lock.json'
                ;;
            esac
          done
  compatibility:
    name: Tool Compatibility (${{ matrix.runtime }})
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: 22.22.2
          - runtime: latest Node 22
            node-version: 22.x
          - runtime: latest Node 24
            node-version: 24.x
          - runtime: latest Node 26
            node-version: 26.x
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Report unaffected validation
        if: needs.impact.outputs.project == 'false'
        run: echo 'This validation is unaffected by the complete change set.'
      - name: Checkout repository
        if: needs.impact.outputs.project == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        if: needs.impact.outputs.project == 'true'
        uses: $/.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.impact.outputs.project == 'true'
        with:
          name: project-packages
          path: ${{ runner.temp }}/forge-packages
      - name: Restore generated engine from the tested package
        if: needs.impact.outputs.native == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/browser-oxfmt"
          tar -xzf "$RUNNER_TEMP/forge-packages/"*browser-oxfmt*.tgz --strip-components=1 -C "$RUNNER_TEMP/browser-oxfmt"
          cp -R "$RUNNER_TEMP/browser-oxfmt/dist/generated" packages/browser-oxfmt/src/generated
          cp "$RUNNER_TEMP/browser-oxfmt/NOTICE.md" packages/browser-oxfmt/NOTICE.md
      - name: Check package types and unit tests
        if: needs.impact.outputs.project == 'true'
        env:
          PACKAGES: ${{ needs.impact.outputs.packages }}
        run: |-
          for package in $PACKAGES; do
            npm run typecheck --workspace "@rm-industries/$package"
            npm test --workspace "@rm-industries/$package"
          done
      - name: Exercise candidate content-model exports
        if: contains(needs.impact.outputs.packages, 'content-model')
        run: |-
          mkdir -p "$RUNNER_TEMP/content-model-check"
          mkdir -p "$RUNNER_TEMP/content-model-check/node_modules/@rm-industries/content-model"
          tar -xzf "$RUNNER_TEMP/forge-packages/"*content-model*.tgz --strip-components=1 -C "$RUNNER_TEMP/content-model-check/node_modules/@rm-industries/content-model"
          ln -s "$GITHUB_WORKSPACE/node_modules/astro" "$RUNNER_TEMP/content-model-check/node_modules/astro"
          cd "$RUNNER_TEMP/content-model-check"
          node --input-type=module <<'CHECK'
          import assert from "node:assert/strict";
          import { defineModel } from "@rm-industries/content-model";
          import { createAstroCollection } from "@rm-industries/content-model/astro";
          import { createSveltiaCollection } from "@rm-industries/content-model/sveltia";
          for (const exported of [defineModel, createAstroCollection, createSveltiaCollection]) assert.equal(typeof exported, "function");
          CHECK
    needs:
      - impact
      - build
  frontmatter-candidate:
    name: Candidate model and frontmatter compatibility
    if: always()
    needs: [impact, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.frontmatterCandidate }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
      - name: Report unaffected validation
        if: needs.impact.outputs.frontmatterCandidate == 'false'
        run: echo 'Candidate frontmatter integration is unaffected.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.impact.outputs.frontmatterCandidate == 'true'
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        if: needs.impact.outputs.frontmatterCandidate == 'true'
        with:
          node-version: 26.x
      - name: Verify isolated packed model and frontmatter consumers
        if: needs.impact.outputs.frontmatterCandidate == 'true'
        run: npm run test:packed --workspace @rm-industries/markdownlint-frontmatter
  validation:
    name: Tool validation
    if: always()
    needs:
      [
        impact,
        format,
        lint-code,
        lint-markdown,
        spellcheck,
        documentation,
        typecheck,
        test,
        native,
        build,
        pack,
        compatibility,
        frontmatter-candidate,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful impact selection and prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.project }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS); if (!Object.values(n).every(j => j.result === "success") || !["true", "false"].includes(process.env.SELECTED)) process.exit(1)'
