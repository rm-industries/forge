---
name: Project Continuous Integration

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Check formatting
        run: npm run format

  lint-code:
    name: Lint code
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Lint code
        run: npm run lint:code

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Lint Markdown
        run: npm run lint:markdown

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Spellcheck
        run: npm run spellcheck

  documentation:
    name: Documentation links and commands
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Check documentation links and commands
        run: npm run docs:validate

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Type-check TypeScript
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Run tests
        run: npm test

  build:
    name: Build
    needs:
      - format
      - lint-code
      - lint-markdown
      - spellcheck
      - documentation
      - typecheck
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Build packages
        run: npm run build

  pack:
    name: Pack
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Inspect package contents
        run: npm run pack

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Audit root and workspace dependencies
        run: npm run audit

  compatibility:
    name: Compatibility (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: '22.22.2'
          - runtime: latest Node 22
            node-version: '22.x'
          - runtime: latest Node 24
            node-version: '24.x'
          - runtime: latest Node 26
            node-version: '26.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate packages on supported runtime
        run: npm run typecheck && npm test && npm run build

  template-compatibility:
    name: Template compatibility (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: '22.22.2'
          - runtime: latest Node 22
            node-version: '22.x'
          - runtime: latest Node 24
            node-version: '24.x'
          - runtime: latest Node 26
            node-version: '26.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Validate copied template on supported runtime
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci
          npm run typecheck
          npm test
          npm run build

  template-coverage:
    name: Template unit coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Test copied template with coverage
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci
          npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-unit-coverage
          path: ${{ runner.temp }}/forge-default-template/coverage
          if-no-files-found: error
          retention-days: 7

  template-static-quality:
    name: Template static quality
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Verify static quality tools
        run: npm run verify:template:static

  template-browser:
    name: Template browser tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Install copied template
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci

      - name: Install Chromium
        working-directory: ${{ runner.temp }}/forge-default-template
        run: npx playwright install --with-deps chromium

      - name: Test copied template in Chromium
        working-directory: ${{ runner.temp }}/forge-default-template
        run: npm run test:e2e

      - name: Upload browser test evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-browser-tests
          path: |
            ${{ runner.temp }}/forge-default-template/playwright-report
            ${{ runner.temp }}/forge-default-template/test-results
          if-no-files-found: error
          retention-days: 7

  template-lighthouse:
    name: Template Lighthouse budgets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Install copied template
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci

      - name: Enforce Lighthouse budgets
        working-directory: ${{ runner.temp }}/forge-default-template
        run: npm run lighthouse:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-lighthouse-reports
          path: ${{ runner.temp }}/forge-default-template/.lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  template-isolation:
    name: Template isolation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Verify standalone template
        run: npm run verify:template

  generator-e2e:
    name: Generator end-to-end
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Install generated-project browser
        working-directory: templates/default
        run: npx playwright install --with-deps chromium

      - name: Test packed generator
        run: npm run test:generator:e2e

  project:
    name: Project
    needs:
      - format
      - lint-code
      - lint-markdown
      - spellcheck
      - documentation
      - typecheck
      - test
      - build
      - pack
      - dependency-audit
      - compatibility
      - template-compatibility
      - template-coverage
      - template-static-quality
      - template-browser
      - template-lighthouse
      - template-isolation
      - generator-e2e
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Confirm project checks
        run: echo "All project checks passed."
