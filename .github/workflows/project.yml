---
name: Project Continuous Integration

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      audit: ${{ steps.selection.outputs.audit }}
      code: ${{ steps.selection.outputs.code }}
      compatibility: ${{ steps.selection.outputs.compatibility }}
      documentation: ${{ steps.selection.outputs.documentation }}
      generator: ${{ steps.selection.outputs.generator }}
      packages: ${{ steps.selection.outputs.packages }}
      template: ${{ steps.selection.outputs.template }}
      website: ${{ steps.selection.outputs.website }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify affected project areas
        id: selection
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACDMRT -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          else
            : > "$RUNNER_TEMP/changed-files"
          fi
          node scripts/classify-ci-changes.ts "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"

  format:
    name: Format
    needs: classify
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Check formatting
        run: npm run format

  lint-code:
    name: Lint code
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Lint code
        run: npm run lint:code

  lint-markdown:
    name: Lint Markdown
    needs: classify
    if: needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Lint Markdown
        run: npm run lint:markdown

  spellcheck:
    name: Spellcheck
    needs: classify
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Spellcheck
        run: npm run spellcheck

  documentation:
    name: Documentation links and commands
    needs: classify
    if: needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Check documentation links and commands
        run: npm run docs:validate

  typecheck:
    name: Type-check
    needs: classify
    if: needs.classify.outputs.packages == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Type-check TypeScript
        run: npm run typecheck

  test:
    name: Test
    needs: classify
    if: needs.classify.outputs.packages == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Run tests
        run: npm test

  build:
    name: Build
    needs:
      - classify
      - format
      - lint-code
      - lint-markdown
      - spellcheck
      - documentation
      - typecheck
    if: >-
      ${{ always() && needs.classify.outputs.packages == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Build packages
        run: npm run build

  pack:
    name: Pack
    needs: classify
    if: needs.classify.outputs.packages == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Inspect package contents
        run: npm run pack

  dependency-audit:
    name: Dependency audit
    needs: classify
    if: needs.classify.outputs.audit == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Audit root and workspace dependencies
        run: npm run audit

  compatibility:
    name: Compatibility (${{ matrix.runtime }})
    needs: classify
    if: needs.classify.outputs.compatibility == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: '22.22.2'
          - runtime: latest Node 22
            node-version: '22.x'
          - runtime: latest Node 24
            node-version: '24.x'
          - runtime: latest Node 26
            node-version: '26.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate packages on supported runtime
        run: npm run typecheck && npm test && npm run build

  template-compatibility:
    name: Template compatibility (${{ matrix.runtime }})
    needs: classify
    if: needs.classify.outputs.template == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: '22.22.2'
          - runtime: latest Node 22
            node-version: '22.x'
          - runtime: latest Node 24
            node-version: '24.x'
          - runtime: latest Node 26
            node-version: '26.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Validate copied template on supported runtime
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci
          npm run typecheck
          npm test
          npm run build

  template-coverage:
    name: Template unit coverage
    needs: classify
    if: needs.classify.outputs.template == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Test copied template with coverage
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci
          npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-unit-coverage
          path: ${{ runner.temp }}/forge-default-template/coverage
          if-no-files-found: error
          retention-days: 7

  template-static-quality:
    name: Template static quality
    needs: classify
    if: needs.classify.outputs.template == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Verify static quality tools
        run: npm run verify:template:static

  template-browser:
    name: Template browser tests
    needs: classify
    if: needs.classify.outputs.template == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Install copied template
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci

      - name: Install supported browsers
        working-directory: ${{ runner.temp }}/forge-default-template
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test copied template in supported browsers
        working-directory: ${{ runner.temp }}/forge-default-template
        run: npm run test:e2e

      - name: Upload browser test evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-browser-tests
          path: |
            ${{ runner.temp }}/forge-default-template/playwright-report
            ${{ runner.temp }}/forge-default-template/test-results
          if-no-files-found: error
          retention-days: 7

  template-lighthouse:
    name: Template Lighthouse budgets
    needs: classify
    if: needs.classify.outputs.template == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Install copied template
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci

      - name: Enforce Lighthouse budgets
        working-directory: ${{ runner.temp }}/forge-default-template
        run: npm run lighthouse:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-lighthouse-reports
          path: ${{ runner.temp }}/forge-default-template/.lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  template-isolation:
    name: Template isolation
    needs: classify
    if: needs.classify.outputs.template == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Verify standalone template
        run: npm run verify:template

  generator-e2e:
    name: Generator end-to-end
    needs: classify
    if: needs.classify.outputs.generator == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Test packed generator
        run: npm run test:generator:e2e

  generator-compatibility:
    name: Generator compatibility (${{ matrix.runtime }})
    needs: classify
    if: needs.classify.outputs.generator == 'true'
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22 on Ubuntu
            os: ubuntu-latest
            node-version: '22.22.2'
          - runtime: latest Node 22 on Ubuntu
            os: ubuntu-latest
            node-version: '22.x'
          - runtime: latest Node 24 on Ubuntu
            os: ubuntu-latest
            node-version: '24.x'
          - runtime: latest Node 26 on Ubuntu
            os: ubuntu-latest
            node-version: '26.x'
          - runtime: latest Node 26 on macOS
            os: macos-latest
            node-version: '26.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Record compatibility environment
        run: |
          uname -a
          node --version
          npm --version
          git --version

      - name: Test packed generator compatibility
        run: npm run test:generator:compatibility

  website-static-quality:
    name: Website static quality
    needs: classify
    if: needs.classify.outputs.website == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Validate website static quality
        run: npm run website:quality:static

  website-compatibility:
    name: Website compatibility (Node 26)
    needs: classify
    if: needs.classify.outputs.website == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Validate website on supported runtime
        run: |
          npm run typecheck --prefix website
          npm run test:unit --prefix website
          npm run build --prefix website
          npm run validate:build --prefix website

  website-validation:
    name: Website unit coverage and build
    needs: classify
    if: needs.classify.outputs.website == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Test website with coverage
        run: npm run website:test:coverage

      - name: Build and validate website
        run: npm run website:build && npm run validate:build --prefix website

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

      - name: Upload website coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-unit-coverage
          path: website/coverage
          if-no-files-found: ignore
          retention-days: 7

  website-browser:
    name: Website browser and accessibility tests
    needs: classify
    if: needs.classify.outputs.website == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Install supported browsers
        working-directory: website
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test website in supported browsers
        run: npm run website:test:browser

      - name: Upload website browser test evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-browser-tests
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
          retention-days: 7

  website-lighthouse:
    name: Website Lighthouse budgets
    needs: classify
    if: needs.classify.outputs.website == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Install Lighthouse browser
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Enforce website Lighthouse budgets
        run: npm run website:lighthouse

      - name: Upload website Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-lighthouse-reports
          path: website/.lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  project:
    name: Project
    needs:
      - classify
      - format
      - lint-code
      - lint-markdown
      - spellcheck
      - documentation
      - typecheck
      - test
      - build
      - pack
      - dependency-audit
      - compatibility
      - template-compatibility
      - template-coverage
      - template-static-quality
      - template-browser
      - template-lighthouse
      - template-isolation
      - generator-e2e
      - generator-compatibility
      - website-static-quality
      - website-compatibility
      - website-validation
      - website-browser
      - website-lighthouse
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Confirm project checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          SELECTED_AUDIT: ${{ needs.classify.outputs.audit }}
          SELECTED_CODE: ${{ needs.classify.outputs.code }}
          SELECTED_COMPATIBILITY: ${{ needs.classify.outputs.compatibility }}
          SELECTED_DOCUMENTATION: ${{ needs.classify.outputs.documentation }}
          SELECTED_GENERATOR: ${{ needs.classify.outputs.generator }}
          SELECTED_PACKAGES: ${{ needs.classify.outputs.packages }}
          SELECTED_TEMPLATE: ${{ needs.classify.outputs.template }}
          SELECTED_WEBSITE: ${{ needs.classify.outputs.website }}
        run: |
          echo "Selected checks: audit=$SELECTED_AUDIT code=$SELECTED_CODE compatibility=$SELECTED_COMPATIBILITY documentation=$SELECTED_DOCUMENTATION generator=$SELECTED_GENERATOR packages=$SELECTED_PACKAGES template=$SELECTED_TEMPLATE website=$SELECTED_WEBSITE"
          if ! jq --exit-status 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<< "$CHECK_RESULTS"; then
            echo '::error title=Project validation failed::Every selected project check must pass.'
            exit 1
          fi
          echo 'Every selected project check passed.'

  website-deployment:
    name: Deploy project website
    needs:
      - classify
      - project
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.website == 'true'

    permissions:
      contents: read
      pages: write
      id-token: write

    uses: ./.github/workflows/website-deployment.yml
