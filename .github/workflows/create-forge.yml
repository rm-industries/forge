---
name: Lockless consumer experiment
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.x
      - run: npm ci --ignore-scripts
      - run: |
          npm run build --workspace @rm-industries/create-forge
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack --ignore-scripts --workspace @rm-industries/create-forge --pack-destination "$RUNNER_TEMP/candidate"
          mv "$RUNNER_TEMP/candidate/"*.tgz "$RUNNER_TEMP/candidate/create-forge.tgz"
          sha512sum "$RUNNER_TEMP/candidate/create-forge.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: experimental-cli
          path: ${{ runner.temp }}/candidate/create-forge.tgz
          if-no-files-found: error
  consumer:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.22.2
            os: ubuntu-latest
            npm: 10.9.4
          - node: 24.x
            os: ubuntu-latest
          - node: 26.x
            os: ubuntu-latest
            browsers: true
          - node: 26.x
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.npm != ''
        run: npm install --global "npm@$NPM_VERSION"
        env:
          NPM_VERSION: ${{ matrix.npm }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: experimental-cli
          path: ${{ runner.temp }}/candidate
      - run: |
          node --version
          npm --version
          mkdir -p "$RUNNER_TEMP/cli"
          npm install --prefix "$RUNNER_TEMP/cli" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/candidate/create-forge.tgz"
          "$RUNNER_TEMP/cli/node_modules/.bin/create-forge" "$RUNNER_TEMP/site" --yes --no-install --no-git --ci-providers github,gitlab
          test ! -e "$RUNNER_TEMP/site/package-lock.json"
      - name: Fresh dependency resolution and full consumer quality
        working-directory: ${{ runner.temp }}/site
        run: |
          npm install --no-audit --no-fund
          npm ls @rm-industries/content-model @sveltia/cms
          npm run quality:core
      - name: Replay the generated lock
        working-directory: ${{ runner.temp }}/site
        run: |
          node --input-type=module -e "import{readFileSync,writeFileSync}from'node:fs';import{createHash}from'node:crypto';writeFileSync('../lock.sha256',createHash('sha256').update(readFileSync('package-lock.json')).digest('hex'));"
          npm ci --no-audit --no-fund
          node --input-type=module -e "import{readFileSync}from'node:fs';import{createHash}from'node:crypto';import assert from'node:assert/strict';assert.equal(createHash('sha256').update(readFileSync('package-lock.json')).digest('hex'),readFileSync('../lock.sha256','utf8'));"
          npm run build
      - if: matrix.browsers == true
        name: Browser and CMS preservation
        working-directory: ${{ runner.temp }}/site
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e -- --workers=2
      - if: matrix.browsers == true
        name: Lighthouse budgets
        working-directory: ${{ runner.temp }}/site
        run: npm run lighthouse:ci
      - if: always() && matrix.browsers == true
        name: Observe dependency audit without changing its findings
        working-directory: ${{ runner.temp }}/site
        run: npm audit --json > audit-observation.json || test -s audit-observation.json
      - if: always() && matrix.browsers == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: experimental-consumer-evidence
          path: |
            ${{ runner.temp }}/site/package-lock.json
            ${{ runner.temp }}/site/audit-observation.json
            ${{ runner.temp }}/site/playwright-report
            ${{ runner.temp }}/site/test-results
            ${{ runner.temp }}/site/.lighthouseci
          include-hidden-files: true
          if-no-files-found: warn
