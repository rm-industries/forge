---
name: Create Forge
on:
  pull_request:
    branches:
      - main
    paths:
      - packages/create-forge/**
      - templates/default/**
      - scripts/verify-consumer-lock.ts
      - scripts/template-workflows.test.ts
      - .github/workflows/create-forge.yml
      - .github/workflows/security.yml
      - .github/workflows/automation.yml
      - .github/workflows/website.yml
      - tsconfig.json
      - package.json
      - package-lock.json
      - .npmrc
      - .github/actions/setup-project/**
  push:
    branches:
      - main
    paths:
      - packages/create-forge/**
      - templates/default/**
      - scripts/verify-consumer-lock.ts
      - scripts/template-workflows.test.ts
      - .github/workflows/create-forge.yml
      - .github/workflows/security.yml
      - .github/workflows/automation.yml
      - .github/workflows/website.yml
      - tsconfig.json
      - package.json
      - package-lock.json
      - .npmrc
      - .github/actions/setup-project/**
  workflow_dispatch: null
  schedule:
    - cron: 23 7 * * 1
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  package:
    name: Inspect packed CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
          working-directory: .
          cache-dependency-path: package-lock.json
      - name: Check CLI types and behavior
        run: |-
          npm run typecheck --workspace @rm-industries/create-forge
          npm test --workspace @rm-industries/create-forge
      - name: Build and inspect one CLI tarball
        run: |-
          npm run build --workspace @rm-industries/create-forge
          mkdir -p "$RUNNER_TEMP/forge-packages"
          npm pack --ignore-scripts --workspace @rm-industries/create-forge --pack-destination "$RUNNER_TEMP/forge-packages"
          mv "$RUNNER_TEMP/forge-packages/"*.tgz "$RUNNER_TEMP/forge-packages/create-forge.tgz"
          tar -tzf "$RUNNER_TEMP/forge-packages/create-forge.tgz" > "$RUNNER_TEMP/forge-package-files"
          for entry in package/dist/index.mjs package/dist/template/.editorconfig package/dist/template/package-lock.json; do grep -Fx "$entry" "$RUNNER_TEMP/forge-package-files"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generator-package
          path: ${{ runner.temp }}/forge-packages/create-forge.tgz
          if-no-files-found: error
          retention-days: 7
  scenarios:
    name: CLI scenarios and packed smoke (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    needs:
      - package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22 on Ubuntu
            os: ubuntu-latest
            node: 22.22.2
            major: '22'
          - runtime: latest Node 22 on Ubuntu
            os: ubuntu-latest
            node: 22.x
            major: '22'
          - runtime: latest Node 24 on Ubuntu
            os: ubuntu-latest
            node: 24.x
            major: '24'
          - runtime: latest Node 26 on Ubuntu
            os: ubuntu-latest
            node: 26.x
            major: '26'
            primary: true
          - runtime: latest Node 26 on macOS
            os: macos-latest
            node: 26.x
            major: '26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: ${{ matrix.node }}
          working-directory: .
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generator-package
          path: ${{ runner.temp }}/forge-packages
      - name: Exercise bootstrap behaviors and packed default build
        run: node packages/create-forge/scripts/test-generator-e2e.ts
        env:
          FORGE_CLI_TARBALL: ${{ runner.temp }}/forge-packages/create-forge.tgz
  generated-source:
    name: Generate workflow scan fixture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
          working-directory: .
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generator-package
          path: ${{ runner.temp }}/forge-packages
      - name: Generate default provider fixture
        run: |- # zizmor: ignore[adhoc-packages] installs the local package artifact from this run
          mkdir -p "$RUNNER_TEMP/forge-cli"
          npm install --prefix "$RUNNER_TEMP/forge-cli" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/forge-packages/create-forge.tgz"
          "$RUNNER_TEMP/forge-cli/node_modules/.bin/create-forge" "$RUNNER_TEMP/forge-consumer" --name ci-consumer --yes --no-install --no-git --ci-providers github,gitlab
          tar -czf "$RUNNER_TEMP/consumer-source.tgz" -C "$RUNNER_TEMP/forge-consumer" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-source
          path: ${{ runner.temp }}/consumer-source.tgz
          if-no-files-found: error
          retention-days: 7
  security:
    name: Generated workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs:
      - generated-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: consumer-source
          path: ${{ runner.temp }}/consumer-artifacts
      - name: Restore the canonical template
        run: |-
          mkdir -p .ci-consumer
          tar -xzf "$RUNNER_TEMP/consumer-artifacts/consumer-source.tgz" -C .ci-consumer
      - name: Scan generated workflows
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: true
          collect: all
          inputs: .ci-consumer/.github
  syntax:
    name: Generated workflow syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - generated-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: consumer-source
          path: ${{ runner.temp }}/consumer-artifacts
      - name: Restore the canonical template
        run: |-
          mkdir -p "$RUNNER_TEMP/forge-consumer"
          tar -xzf "$RUNNER_TEMP/consumer-artifacts/consumer-source.tgz" -C "$RUNNER_TEMP/forge-consumer"
      - name: Validate generated workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          files: ${{ runner.temp }}/forge-consumer/.github/workflows/*.yml
