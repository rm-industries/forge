---
name: Content Model Package

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    paths:
      - 'packages/content-model/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.verification.json'
      - '.github/actions/setup-project/action.yml'
      - '.github/workflows/content-model.yml'
      - 'scripts/package-workflows.test.ts'
  push:
    branches: [main]
    paths:
      - 'packages/content-model/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.verification.json'
      - '.github/actions/setup-project/action.yml'
      - '.github/workflows/content-model.yml'
      - 'scripts/package-workflows.test.ts'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions: {}

concurrency:
  group: content-model-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
      - name: Verify package contracts
        run: |
          npm run typecheck --workspace @rm-industries/content-model
          npm test --workspace @rm-industries/content-model
          npm run build --workspace @rm-industries/content-model
      - name: Pack and inspect tested candidate
        run: |
          mkdir -p "$RUNNER_TEMP/forge-packages"
          npm pack --ignore-scripts --workspace @rm-industries/content-model --pack-destination "$RUNNER_TEMP/forge-packages"
          for entry in dist/index.js dist/index.d.ts dist/astro.js dist/astro.d.ts dist/sveltia.js dist/sveltia.d.ts; do
            tar -tzf "$RUNNER_TEMP/forge-packages/"*.tgz | grep -Fx "package/$entry"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-model-package
          path: ${{ runner.temp }}/forge-packages/*.tgz
          if-no-files-found: error
          retention-days: 7
  compatibility:
    name: Runtime (${{ matrix.runtime }})
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: 22.22.2
          - runtime: latest Node 22
            node-version: 22.x
          - runtime: latest Node 24
            node-version: 24.x
          - runtime: latest Node 26
            node-version: 26.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: content-model-package
          path: ${{ runner.temp }}/forge-packages
      - name: Check package types and unit tests
        run: |
          npm run typecheck --workspace @rm-industries/content-model
          npm test --workspace @rm-industries/content-model
      - name: Exercise packed public exports
        run: |
          mkdir -p "$RUNNER_TEMP/content-model-check/node_modules/@rm-industries/content-model"
          tar -xzf "$RUNNER_TEMP/forge-packages/"*.tgz --strip-components=1 -C "$RUNNER_TEMP/content-model-check/node_modules/@rm-industries/content-model"
          ln -s "$GITHUB_WORKSPACE/node_modules/astro" "$RUNNER_TEMP/content-model-check/node_modules/astro"
          cd "$RUNNER_TEMP/content-model-check"
          node --input-type=module <<'CHECK'
          import assert from "node:assert/strict";
          import { defineModel } from "@rm-industries/content-model";
          import { createAstroCollection } from "@rm-industries/content-model/astro";
          import { createSveltiaCollection } from "@rm-industries/content-model/sveltia";
          for (const exported of [defineModel, createAstroCollection, createSveltiaCollection]) assert.equal(typeof exported, "function");
          CHECK
