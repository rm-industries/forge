---
name: Published Template Synchronization

on: # yamllint disable-line rule:truthy
  repository_dispatch:
    types:
      - content-model-published
      - browser-oxfmt-published
  pull_request:
    branches: [main]
    paths:
      - package-lock.json
      - templates/default/package-lock.json
  workflow_dispatch:
    inputs:
      package:
        description: Published reusable package
        required: true
        default: content-model
        type: choice
        options: [content-model, browser-oxfmt]
      version:
        description: Exact published package version
        required: true
        type: string

permissions: {}

concurrency:
  group: published-template-synchronization-${{ github.event.pull_request.number || 'prepare' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  synchronize:
    if: github.event_name != 'pull_request'
    name: Synchronize published dependency
    runs-on: ubuntu-latest

    permissions:
      actions: read
      checks: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project dependencies
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.8.1
          native: 'true'

      - name: Resolve verified publication
        id: source
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          EVENT_PACKAGE: ${{ github.event.client_payload.package }}
          EXPECTED_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          EXPECTED_VERSION: ${{ github.event.client_payload.version }}
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
        run: |
          sync_directory="${RUNNER_TEMP}/forge-template-sync"
          mkdir "$sync_directory"
          slug="${INPUT_PACKAGE:-${EVENT_PACKAGE:-content-model}}"
          case "$slug" in
            content-model) host='@sveltia/cms' ;;
            browser-oxfmt) host='oxfmt' ;;
            *) echo 'Unsupported refresh package'; exit 1 ;;
          esac
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == 'repository_dispatch' ]]; then
            if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo '::error title=Invalid source run::The publication dispatch did not provide a numeric workflow run ID.'
              exit 1
            fi
            artifact_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
              --jq "[.artifacts[] | select(.expired == false and (.name | startswith(\"published-${slug}-\")))] | if length == 1 then .[0].name else empty end")
            if [[ -z "$artifact_name" ]]; then
              echo 'eligible=false' >> "$GITHUB_OUTPUT"
              echo '::notice title=No approved publication::The completed release did not expose one verified reusable-package result.'
              exit 0
            fi
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "${sync_directory}/source"
            publication="${sync_directory}/source/published.json"
            version=$(jq -er --arg name "@rm-industries/${slug}" 'select(.packageName == $name and .publication.verified == true) | .version' "$publication")
            release_tag=$(jq -er .releaseTag "$publication")
            if [[ "$release_tag" != "$EXPECTED_RELEASE_TAG" || "$version" != "$EXPECTED_VERSION" ]]; then
              echo '::error title=Publication dispatch mismatch::The dispatch payload does not match the verified publication artifact.'
              exit 1
            fi
            echo "publication=$publication" >> "$GITHUB_OUTPUT"
            echo "source-url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            version="$INPUT_VERSION"
            echo "source-url=https://github.com/${GITHUB_REPOSITORY}/actions/workflows/template-sync.yml" >> "$GITHUB_OUTPUT"
          fi
          if ! node -e 'const value=process.argv[1]; if (!/^v?(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(value)) process.exit(1)' "$version"; then
            echo '::error title=Invalid package version::The synchronization source did not provide an exact semantic version.'
            exit 1
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read registry metadata
        if: steps.source.outputs.eligible == 'true'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          PACKAGE: ${{ steps.source.outputs.slug }}
          HOST: ${{ steps.source.outputs.host }}
        run: |
          sync_directory="${RUNNER_TEMP}/forge-template-sync"
          npm view "@rm-industries/${PACKAGE}@${VERSION}" --json > "${sync_directory}/package.json"
          npm view "$HOST" versions --json > "${sync_directory}/peer-versions.json"

      - name: Prepare template synchronization
        if: steps.source.outputs.eligible == 'true'
        id: prepare
        env:
          PUBLICATION: ${{ steps.source.outputs.publication }}
        run: |
          sync_directory="${RUNNER_TEMP}/forge-template-sync"
          arguments=(--metadata "${sync_directory}/package.json" --peer-versions "${sync_directory}/peer-versions.json" --write --output "${sync_directory}/plan.json")
          if [[ -n "$PUBLICATION" ]]; then
            arguments+=(--publication "$PUBLICATION")
          fi
          npm run --silent template:sync -- "${arguments[@]}"
          plan=$(<"${sync_directory}/plan.json")
          {
            echo "changed=$(jq -r .changed <<< "$plan")"
            echo "package-version=$(jq -r .package.version <<< "$plan")"
            echo "integration=$(jq -r .integration.version <<< "$plan")"
            echo "integrity=$(jq -r .package.integrity <<< "$plan")"
            echo "peer-range=$(jq -r .integration.peerRange <<< "$plan")"
            echo "release-tag=$(jq -r .releaseTag <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Published template synchronization'
            echo ''
            echo '| Item | Value |'
            echo '| --- | --- |'
            echo "| Reusable package | $(jq -r .package.previousVersion <<< "$plan") → $(jq -r .package.version <<< "$plan") |"
            echo "| Integration host | $(jq -r .integration.previousVersion <<< "$plan") → $(jq -r .integration.version <<< "$plan") |"
            echo "| Published peer range | $(jq -r .integration.peerRange <<< "$plan") |"
            echo "| Registry integrity | $(jq -r .package.integrity <<< "$plan") |"
            echo "| Change required | $(jq -r .changed <<< "$plan") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh authoring dependencies
        if: steps.prepare.outputs.changed == 'true'
        env:
          PACKAGE: ${{ steps.source.outputs.slug }}
        run: |-
          if [[ "$PACKAGE" == 'content-model' ]]; then
            npm update @sveltia/cms --package-lock-only --ignore-scripts
          fi
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm ci --prefix templates/default
          npx oxfmt --write package-lock.json templates/default/package-lock.json

      - name: Install generated-project browsers
        if: steps.prepare.outputs.changed == 'true'
        working-directory: templates/default
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate repository and standalone outputs
        if: steps.prepare.outputs.changed == 'true'
        run: |
          npm run quality
          npm run verify:template
          npm run test:generator:e2e

      - name: Verify GitHub App configuration
        if: steps.prepare.outputs.changed == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.PEER_UPGRADE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PEER_UPGRADE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error title=GitHub App configuration missing::The repository-scoped peer-upgrade App is required to create synchronization pull requests.'
            exit 1
          fi

      - name: Create GitHub App token
        if: steps.prepare.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PEER_UPGRADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PEER_UPGRADE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve GitHub App identity
        if: steps.prepare.outputs.changed == 'true'
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Push synchronization branch
        id: push
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
          PACKAGE_VERSION: ${{ steps.prepare.outputs.package-version }}
          PACKAGE: ${{ steps.source.outputs.slug }}
        run: |
          branch="automation/template-${PACKAGE}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -C "$branch"
          changed_files=$(git diff --name-only)
          if [[ -z "$changed_files" ]] || grep -Ev '^(package-lock\.json|templates/default/package-lock\.json)$' <<< "$changed_files"; then
            echo 'Only authoring locks may change in a compatible refresh'; exit 1
          fi
          git add package-lock.json templates/default/package-lock.json
          git commit -m "chore: refresh ${PACKAGE} ${PACKAGE_VERSION} authoring locks"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          remote_commit=$(git ls-remote --heads origin "$branch" | cut -f1)
          if [[ -n "$remote_commit" ]]; then
            git push --force-with-lease="refs/heads/${branch}:${remote_commit}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

      - name: Open or update synchronization pull request
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE_VERSION: ${{ steps.prepare.outputs.package-version }}
          PACKAGE: ${{ steps.source.outputs.slug }}
          INTEGRATION: ${{ steps.prepare.outputs.integration }}
          INTEGRITY: ${{ steps.prepare.outputs.integrity }}
          PEER_RANGE: ${{ steps.prepare.outputs.peer-range }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release-tag }}
          SOURCE_URL: ${{ steps.source.outputs.source-url }}
        run: |
          branch="automation/template-${PACKAGE}"
          pull_request=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          npm_url="https://www.npmjs.com/package/@rm-industries/${PACKAGE}/v/${PACKAGE_VERSION}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          body_file="${RUNNER_TEMP}/automation-pr-body.md"
          printf '%s\n' \
            '## Summary' \
            '' \
            "- refresh authoring locks for @rm-industries/${PACKAGE} ${PACKAGE_VERSION}" \
            "- resolve the compatible host ${INTEGRATION} within unchanged consumer and published peer ranges ${PEER_RANGE}" \
            '- regenerate the standalone template lockfile from public registry artifacts' \
            '- retain delivered declarations, create-forge version and changelog; no generator publication intent' \
            '- validate the isolated template, packed generator, and generated project before creating this PR' \
            '' \
            '## Publication evidence' \
            '' \
            "- npm package: ${npm_url}" \
            "- GitHub release: ${release_url}" \
            "- source publication: ${SOURCE_URL}" \
            "- registry integrity: \`${INTEGRITY}\`" \
            '' \
            'Generated by the publication synchronization automation tracked in #95.' \
            '' \
            'Automatic merge requires successful designated authoring-refresh validation on the resulting PR HEAD, plus required project checks.' > "$body_file"
          if [[ -n "$pull_request" ]]; then
            gh pr edit "$pull_request" --title "Refresh ${PACKAGE} ${PACKAGE_VERSION} authoring locks" --body-file "$body_file"
            pull_request_url=$(gh pr view "$pull_request" --json url --jq .url)
          else
            pull_request_url=$(gh pr create --head "$branch" --base main --title "Refresh ${PACKAGE} ${PACKAGE_VERSION} authoring locks" --body-file "$body_file")
          fi
          echo "- ✅ Synchronization pull request: ${pull_request_url}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Template synchronization pull request::${pull_request_url}"

      - name: Report current template
        if: steps.source.outputs.eligible == 'true' && steps.prepare.outputs.changed != 'true'
        run: |
          echo '::notice title=Template current::The standalone template already uses the verified publication and matching integration.'
          echo '- ✅ No standalone template synchronization is required.' >> "$GITHUB_STEP_SUMMARY"

      - name: Enable checked synchronization auto-merge
        if: steps.prepare.outputs.changed == 'true'
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE: ${{ steps.source.outputs.slug }}
          EXPECTED_HEAD: ${{ steps.push.outputs.sha }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |-
          branch="automation/template-${PACKAGE}"
          # Required branch checks alone may be permissive; require this workflow's designated evidence.
          for attempt in {1..120}; do
            current_head=$(gh pr view "$branch" --json headRefOid --jq .headRefOid)
            test "$current_head" = "$EXPECTED_HEAD"
            checks=$(GH_TOKEN="$GH_READ_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD}/check-runs?check_name=Validate%20authoring%20refresh&per_page=100")
            result=$(jq -r --arg sha "$EXPECTED_HEAD" '[.check_runs[] | select(.name == "Validate authoring refresh" and .head_sha == $sha and .app.slug == "github-actions")] | sort_by(.id) | last | if .status == "completed" then .conclusion else "pending" end' <<< "$checks")
            if [[ "$result" == 'success' ]]; then
              gh pr merge "$branch" --auto --squash --match-head-commit "$EXPECTED_HEAD"
              exit 0
            fi
            if [[ "$result" != 'pending' ]]; then
              echo "Designated refresh validation failed: $result"; exit 1
            fi
            sleep 30
          done
          echo 'Timed out waiting for designated PR HEAD validation'; exit 1

  validate-refresh:
    name: Validate authoring refresh
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'automation/template-content-model' || github.head_ref == 'automation/template-browser-oxfmt')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout resulting pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require lock-only refresh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          if [[ -z "$files" ]] || grep -Ev '^(package-lock\.json|templates/default/package-lock\.json)$' <<< "$files"; then
            echo 'Compatible refreshes may change only authoring locks'; exit 1
          fi
          node --input-type=module -e 'import { execFileSync } from "node:child_process"; import assert from "node:assert/strict"; for (const path of ["package-lock.json", "templates/default/package-lock.json"]) { const read = sha => JSON.parse(execFileSync("git", ["show", `${sha}:${path}`], {encoding:"utf8"})); assert.deepEqual(read(process.env.HEAD_SHA).packages[""], read(process.env.BASE_SHA).packages[""]); }'
      - name: Setup project dependencies
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.8.1
          native: 'true'
      - name: Install standalone dependencies
        run: npm ci --prefix templates/default
      - name: Install generated-project browsers
        working-directory: templates/default
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate resulting authoring refresh
        run: |
          node scripts/verify-consumer-lock.ts templates/default
          npm run quality
          npm run verify:template
          npm run test:generator:e2e
