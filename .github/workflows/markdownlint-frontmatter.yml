---
name: Markdownlint Frontmatter Package

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    paths:
      - 'packages/markdownlint-frontmatter/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.verification.json'
      - '.github/actions/setup-project/action.yml'
      - '.github/workflows/markdownlint-frontmatter.yml'
      - 'scripts/package-workflows.test.ts'
  push:
    branches: [main]
    paths:
      - 'packages/markdownlint-frontmatter/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.verification.json'
      - '.github/actions/setup-project/action.yml'
      - '.github/workflows/markdownlint-frontmatter.yml'
      - 'scripts/package-workflows.test.ts'
  workflow_dispatch:
  schedule:
    - cron: '29 7 * * 1'

permissions: {}

concurrency:
  group: markdownlint-frontmatter-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
      - name: Verify package contracts
        run: |
          npm run typecheck --workspace @rm-industries/markdownlint-frontmatter
          npm test --workspace @rm-industries/markdownlint-frontmatter
      # The packed consumer harness owns the single package build.
      - name: Build and verify isolated packed consumer
        run: npm run test:packed --workspace @rm-industries/markdownlint-frontmatter
      - name: Pack and inspect tested candidate
        run: |
          mkdir -p "$RUNNER_TEMP/forge-packages"
          npm pack --ignore-scripts --workspace @rm-industries/markdownlint-frontmatter --pack-destination "$RUNNER_TEMP/forge-packages"
          for entry in dist/index.js dist/index.d.ts; do
            tar -tzf "$RUNNER_TEMP/forge-packages/"*.tgz | grep -Fx "package/$entry"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdownlint-frontmatter-package
          path: ${{ runner.temp }}/forge-packages/*.tgz
          if-no-files-found: error
          retention-days: 7
  compatibility:
    name: Runtime (${{ matrix.runtime }})
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: 22.22.2
          - runtime: latest Node 22
            node-version: 22.x
          - runtime: latest Node 24
            node-version: 24.x
          - runtime: latest Node 26
            node-version: 26.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: markdownlint-frontmatter-package
          path: ${{ runner.temp }}/forge-packages
      - name: Check package types and unit tests
        run: |
          npm run typecheck --workspace @rm-industries/markdownlint-frontmatter
          npm test --workspace @rm-industries/markdownlint-frontmatter
      - name: Exercise packed entrypoint
        run: |
          mkdir -p "$RUNNER_TEMP/markdownlint-frontmatter-check"
          tar -xzf "$RUNNER_TEMP/forge-packages/"*.tgz --strip-components=1 -C "$RUNNER_TEMP/markdownlint-frontmatter-check"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/markdownlint-frontmatter-check/node_modules"
          node --input-type=module -e 'await import(process.argv[1])' "$RUNNER_TEMP/markdownlint-frontmatter-check/dist/index.js"
