---
name: Model and CMS Integration
on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-frontmatter-model.test.ts'
      - 'packages/browser-oxfmt/test/sveltia-serialization.ts'
      - 'scripts/vitest.config.ts'
      - 'scripts/final-ci-contract.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.verification.json'
      - '.npmrc'
      - '.github/actions/setup-project/**'
      - '.github/workflows/integration.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-frontmatter-model.test.ts'
      - 'packages/browser-oxfmt/test/sveltia-serialization.ts'
      - 'scripts/vitest.config.ts'
      - 'scripts/final-ci-contract.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.verification.json'
      - '.npmrc'
      - '.github/actions/setup-project/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
  schedule:
    - cron: '59 7 * * 1'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  model-cms:
    name: Model and CMS serialization
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
          native: 'true'
      - name: Check cross-package model contracts and integration types
        run: |
          npm run test:integration
          npx tsc --project tsconfig.verification.json --noEmit
      - name: Build local model and native formatter
        run: |
          npm run build --workspace @rm-industries/content-model
          npm run build --workspace @rm-industries/browser-oxfmt
      - name: Install CMS browser
        run: npx playwright install --with-deps chromium
      - name: Verify CMS serialization and preservation
        run: node packages/browser-oxfmt/test/sveltia-serialization.ts node_modules/playwright-core/index.mjs
