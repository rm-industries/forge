---
name: Fresh consumer
on:
  pull_request:
    branches: [main]
    paths:
      - packages/create-forge/**
      - templates/default/**
      - scripts/fresh-consumer*
      - scripts/verify-consumer-lock.ts
      - scripts/verify-template.ts
      - .github/actions/setup-project/**
      - .npmrc
      - .github/workflows/fresh-consumer.yml
      - package.json
      - package-lock.json
  schedule:
    - cron: 43 8 * * *
    - cron: 23 7 * * 1
  workflow_dispatch:
    inputs:
      target:
        description: Artifact selection rehearsal
        type: choice
        options: [candidate, stable]
        default: stable
      coverage:
        description: Consumer acceptance coverage
        type: choice
        options: [daily, weekly]
        default: daily
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      state: ${{ steps.select.outputs.state }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
          working-directory: .
          cache-dependency-path: package-lock.json
      - name: Plan daily or weekly coverage
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_COVERAGE: ${{ inputs.coverage }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |-
          coverage=daily
          if [[ "$SCHEDULE" == '23 7 * * 1' ]]; then coverage=weekly; fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then coverage="$REQUESTED_COVERAGE"; fi
          node scripts/fresh-consumer.ts plan "$coverage"
      - name: Select candidate or published stable once
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |-
          target=stable
          if [[ "$EVENT_NAME" == pull_request ]]; then target=candidate; fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then target="$REQUESTED_TARGET"; fi
          case "$target" in
            candidate)
              npm run build --workspace @rm-industries/create-forge
              mkdir -p "$RUNNER_TEMP/packed"
              npm pack --ignore-scripts --workspace @rm-industries/create-forge --pack-destination "$RUNNER_TEMP/packed"
              node scripts/fresh-consumer.ts select candidate "$RUNNER_TEMP/selection" "$RUNNER_TEMP/packed/"*.tgz
              ;;
            stable) node scripts/fresh-consumer.ts select stable "$RUNNER_TEMP/selection" ;;
            *) echo 'Invalid artifact target' >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fresh-selection
          path: ${{ runner.temp }}/selection
          if-no-files-found: error
          retention-days: 7
  consumer:
    needs: select
    if: needs.select.outputs.state == 'active'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: ${{ matrix.node }}
          working-directory: .
          cache-dependency-path: package-lock.json
      - name: Select supported npm major
        env:
          NPM_MAJOR: ${{ matrix.npm }}
        run: npm install --global "npm@$NPM_MAJOR" # zizmor: ignore[adhoc-packages] compatibility probe intentionally tests the selected npm major
        # Runner-scoped installation; consumer evidence records the exact npm version.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fresh-selection
          path: ${{ runner.temp }}/selection
      - name: Validate isolated public consumer
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
          PROBE: ${{ matrix.probe }}
        run: node scripts/fresh-consumer.ts validate "$RUNNER_TEMP/selection" "$RUNNER_TEMP/fresh-consumer" "$PROBE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fresh-${{ matrix.os }}-node-${{ matrix.node }}-npm-${{ matrix.npm }}-evidence
          path: |
            ${{ runner.temp }}/fresh-consumer/*.json
            ${{ runner.temp }}/fresh-consumer/*.log
            ${{ runner.temp }}/fresh-consumer/consumer/playwright-report
            ${{ runner.temp }}/fresh-consumer/consumer/test-results
            ${{ runner.temp }}/fresh-consumer/consumer/.lighthouseci
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
