---
name: Generator CI Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Generated workflow security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Generate consumer workflows for validation
        run: |
          npm run build --workspace @rm-industries/create-forge
          node packages/create-forge/dist/index.mjs .ci-review-fixture --name ci-review-fixture --yes --no-install --no-git --ci-providers github,gitlab

      - name: Scan workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: true
          collect: all
          inputs: .ci-review-fixture/.github

  syntax:
    name: Generated workflow syntax
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Generate consumer workflows for validation
        run: |
          npm run build --workspace @rm-industries/create-forge
          node packages/create-forge/dist/index.mjs .ci-review-fixture --name ci-review-fixture --yes --no-install --no-git --ci-providers github,gitlab

      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          files: '.ci-review-fixture/.github/workflows/*.yml'

  template-compatibility:
    name: Template compatibility (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: '22.22.2'
          - runtime: latest Node 22
            node-version: '22.x'
          - runtime: latest Node 24
            node-version: '24.x'
          - runtime: latest Node 26
            node-version: '26.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Validate copied template on supported runtime
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci
          npm run typecheck
          npm test
          npm run build

  template-coverage:
    name: Template unit coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Test copied template with coverage
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci
          npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-unit-coverage
          path: ${{ runner.temp }}/forge-default-template/coverage
          if-no-files-found: error
          retention-days: 7

  template-static-quality:
    name: Template static quality
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Verify static quality tools
        run: npm run verify:template:static

  template-build:
    name: Template production build
    needs:
      - template-coverage
      - template-static-quality
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Build copied template once
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci
          npm run build

      - name: Upload template production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-build
          path: ${{ runner.temp }}/forge-default-template/dist
          if-no-files-found: error
          retention-days: 7

  template-dependency-audit:
    name: Template dependency audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup template
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: templates/default/package-lock.json
          working-directory: templates/default

      - name: Audit template dependencies
        id: audit
        continue-on-error: true
        run: npm run audit --prefix templates/default

      - name: Report dependency audit
        if: steps.audit.outcome == 'failure'
        run: |
          echo '::warning title=Template dependency security findings::Review Dependabot alerts and the audit output. Dependency findings are reported here but do not block pull-request remediation.'
          echo '## Template dependency security findings' >> "$GITHUB_STEP_SUMMARY"
          echo 'The template dependency audit found blocking-severity advisories. Review the audit output and Dependabot alerts. Release security gates remain blocking.' >> "$GITHUB_STEP_SUMMARY"

  template-browser:
    name: Template browser tests
    needs:
      - template-build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Install copied template
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci

      - name: Download template production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-build
          path: ${{ runner.temp }}/forge-default-template/dist

      - name: Install supported browsers
        working-directory: ${{ runner.temp }}/forge-default-template
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test copied template in supported browsers
        working-directory: ${{ runner.temp }}/forge-default-template
        run: npm run test:e2e

      - name: Upload browser test evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-browser-tests
          path: |
            ${{ runner.temp }}/forge-default-template/playwright-report
            ${{ runner.temp }}/forge-default-template/test-results
          if-no-files-found: error
          retention-days: 7

  template-lighthouse:
    name: Template Lighthouse budgets
    needs:
      - template-build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: templates/default/package-lock.json

      - name: Install copied template
        run: |
          template_directory="${RUNNER_TEMP}/forge-default-template"
          cp -R templates/default "$template_directory"
          cd "$template_directory"
          npm ci

      - name: Download template production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-build
          path: ${{ runner.temp }}/forge-default-template/dist

      - name: Enforce Lighthouse budgets
        working-directory: ${{ runner.temp }}/forge-default-template
        run: npm run lighthouse:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-lighthouse-reports
          path: ${{ runner.temp }}/forge-default-template/.lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  template-isolation:
    name: Template isolation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Verify standalone template
        run: npm run verify:template

  generator-e2e:
    name: Generator end-to-end
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Test packed generator
        run: npm run test:generator:e2e

  generator-compatibility:
    name: Generator compatibility (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22 on Ubuntu
            os: ubuntu-latest
            node-version: '22.22.2'
          - runtime: latest Node 22 on Ubuntu
            os: ubuntu-latest
            node-version: '22.x'
          - runtime: latest Node 24 on Ubuntu
            os: ubuntu-latest
            node-version: '24.x'
          - runtime: latest Node 26 on Ubuntu
            os: ubuntu-latest
            node-version: '26.x'
          - runtime: latest Node 26 on macOS
            os: macos-latest
            node-version: '26.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Record compatibility environment
        run: |
          uname -a
          node --version
          npm --version
          git --version

      - name: Test packed generator compatibility
        run: npm run test:generator:compatibility
