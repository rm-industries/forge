---
name: Forge Website Continuous Integration

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: website

jobs:
  impact:
    name: Select website impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      website: ${{ steps.impact.outputs.website }}
      full-browsers: ${{ steps.impact.outputs.website-full-browsers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected work
        id: impact
        uses: $/.github/actions/ci-impact

  format:
    needs: impact
    if: needs.impact.outputs.website == 'true'
    name: Format
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website

      - name: Check formatting
        run: npm run format

  spellcheck:
    needs: impact
    if: needs.impact.outputs.website == 'true'
    name: Spellcheck
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website

      - name: Check spelling
        run: npm run spellcheck

  lint-code:
    needs: impact
    if: needs.impact.outputs.website == 'true'
    name: Lint code
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website

      - name: Lint code
        run: npm run lint:code -- --format github

  lint-styles:
    needs: impact
    if: needs.impact.outputs.website == 'true'
    name: Lint styles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website
      - name: Lint styles
        run: npm run lint:css

  lint-markdown:
    needs: impact
    if: needs.impact.outputs.website == 'true'
    name: Lint Markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website
      - name: Lint source Markdown
        run: npm run lint:markdown

  audit-unused:
    needs: impact
    if: needs.impact.outputs.website == 'true'
    name: Audit unused code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website
      - name: Audit unused code and dependencies
        run: npm run audit:unused

  typecheck:
    needs: impact
    if: needs.impact.outputs.website == 'true'
    name: Type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website
      - name: Check TypeScript and Astro diagnostics
        run: npm run typecheck

  unit-tests:
    needs: impact
    if: needs.impact.outputs.website == 'true'
    name: Unit tests and coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-unit-coverage
          path: website/coverage
          if-no-files-found: error
          retention-days: 7

  build:
    name: Production build
    needs:
      - format
      - lint-code
      - lint-styles
      - lint-markdown
      - spellcheck
      - audit-unused
      - typecheck
      - unit-tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website

      - name: Build production site once
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-build
          path: website/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

  validate-build:
    name: Validate build
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website
      - name: Download production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-build
          path: website/dist
      - name: Validate production artifacts
        run: npm run validate:build

  browser-tests:
    name: Browser and accessibility tests
    needs:
      - impact
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website

      - name: Install selected browsers
        env:
          FULL_BROWSERS: ${{ needs.impact.outputs.full-browsers }}
        run: |
          if [[ "$FULL_BROWSERS" == 'true' ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Download production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-build
          path: website/dist

      - name: Run browser and accessibility tests
        env:
          FULL_BROWSERS: ${{ needs.impact.outputs.full-browsers }}
        run: |
          if [[ "$FULL_BROWSERS" == 'true' ]]; then
            npm run test:e2e
          else
            npm run test:e2e -- --project=chromium
          fi

      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          include-hidden-files: true
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    needs:
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website

      - name: Install Lighthouse browser
        run: npx playwright install --with-deps chromium

      - name: Download production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-build
          path: website/dist

      - name: Enforce Lighthouse budgets
        run: npm run lighthouse:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: website/.lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    needs:
      - format
      - lint-code
      - lint-styles
      - lint-markdown
      - spellcheck
      - audit-unused
      - typecheck
      - unit-tests
      - build
      - validate-build
      - browser-tests
      - lighthouse
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke-deployed:
    name: Verify deployed website
    timeout-minutes: 10
    needs:
      - deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'
          cache-dependency-path: website/package-lock.json
          working-directory: website
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed routes, assets, and mobile layout
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.page-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          npm run test:smoke
      - name: Upload deployed smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-deployed-smoke-results
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
          retention-days: 7

  validation:
    name: Website validation
    if: always()
    needs:
      [
        impact,
        format,
        spellcheck,
        lint-code,
        lint-styles,
        lint-markdown,
        audit-unused,
        typecheck,
        unit-tests,
        build,
        validate-build,
        browser-tests,
        lighthouse,
        deploy,
        smoke-deployed,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected validation and deployment outcomes
        working-directory: .
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.impact.outputs.website }}
          FULL_BROWSERS: ${{ needs.impact.outputs.full-browsers }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |-
          node -e 'const n=JSON.parse(process.env.NEEDS),s=process.env.SELECTED,d=s === "true" && process.env.EVENT === "push" && process.env.REF === "refs/heads/main"; if (!["true","false"].includes(s) || !["true","false"].includes(process.env.FULL_BROWSERS) || !Object.entries(n).every(([id,j]) => j.result === (id === "impact" ? "success" : ["deploy","smoke-deployed"].includes(id) ? d ? "success" : "skipped" : s === "true" ? "success" : "skipped"))) process.exit(1)'
