---
name: Website image integration experiment
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: website-image-experiment-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
    working-directory: website
jobs:
  integration:
    name: Website Chromium integration and public smoke
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
          cache-dependency-path: website/package-lock.json
          working-directory: website
      - name: Verify matching browser image version
        run: node --input-type=module -e "import { createRequire } from 'node:module'; const require = createRequire(import.meta.url); if (require('@playwright/test/package.json').version !== '1.64.1') throw new Error('Image and Playwright version mismatch'); console.log(process.version, require('@playwright/test/package.json').version);"
      - name: Build production site
        run: npm run build
      - name: Validate production artifact
        run: npm run validate:build
      - name: Run existing Chromium integration and accessibility tests
        run: npm run test:e2e -- --project=chromium
      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-image-integration
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Check existing public deployment using existing smoke test
        env:
          DEPLOYMENT_URL: https://www.rm-industries.com/forge/
        run: npm run test:smoke
      - name: Retain smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-image-smoke
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
          retention-days: 7
