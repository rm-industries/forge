---
name: Playwright environment experiment
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: playwright-investigation-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  lighthouse-image:
    name: Lighthouse image (${{ matrix.repetition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: template-source
          run-id: 40715679472
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/consumer-artifacts
      - name: Restore the canonical template
        run: |-
          mkdir -p "$RUNNER_TEMP/forge-template"
          tar -xzf "$RUNNER_TEMP/consumer-artifacts/template-source.tgz" -C "$RUNNER_TEMP/forge-template"
      - name: Install template dependencies
        uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
          working-directory: ${{ runner.temp }}/forge-template
          cache-dependency-path: templates/default/package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: template-build
          run-id: 40715679472
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/consumer-artifacts
      - name: Restore production build
        run: tar -xzf "$RUNNER_TEMP/consumer-artifacts/template-build.tgz" -C "$RUNNER_TEMP/forge-template"
      - name: Verify preinstalled browser version
        run: node --input-type=module -e "import { createRequire } from 'node:module'; const require = createRequire(import.meta.url); if (require('@playwright/test/package.json').version !== '1.64.1') throw new Error('Image and Playwright version mismatch'); console.log(process.version, require('@playwright/test/package.json').version);"
        working-directory: ${{ runner.temp }}/forge-template
      - name: Audit the shared production artifact
        env:
          LHCI_COLLECT__SETTINGS__CHROME_FLAGS: --no-sandbox --disable-dev-shm-usage --disable-gpu
        run: |
          export CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath());')"
          npm run lighthouse:ci
        working-directory: ${{ runner.temp }}/forge-template
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: consumer-lighthouse-image-${{ matrix.repetition }}
          path: ${{ runner.temp }}/forge-template/.lighthouseci
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
        if: always()
