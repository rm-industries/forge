---
name: Browser Oxfmt Package

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    paths:
      - 'packages/browser-oxfmt/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.verification.json'
      - '.github/actions/setup-project/action.yml'
      - '.github/workflows/browser-oxfmt.yml'
      - 'templates/default/package.json'
      - 'templates/default/package-lock.json'
      - 'templates/default/oxfmt.config.ts'
      - 'templates/default/.editorconfig'
  push:
    branches: [main]
    paths:
      - 'packages/browser-oxfmt/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.verification.json'
      - '.github/actions/setup-project/action.yml'
      - '.github/workflows/browser-oxfmt.yml'
      - 'templates/default/package.json'
      - 'templates/default/package-lock.json'
      - 'templates/default/oxfmt.config.ts'
      - 'templates/default/.editorconfig'
  workflow_dispatch:
  schedule:
    - cron: '53 7 * * 1'

permissions: {}

concurrency:
  group: browser-oxfmt-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: 1.97.0
  CARGO_TARGET_DIR: ${{ github.workspace }}/.browser-oxfmt-target

jobs:
  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: 26.x
          native: 'true'
      - name: Reproduce native release assets
        run: |
          npm run build:native --workspace @rm-industries/browser-oxfmt -- --force
          cp packages/browser-oxfmt/src/generated/identity.json "$RUNNER_TEMP/first-identity.json"
          cp packages/browser-oxfmt/NOTICE.md "$RUNNER_TEMP/first-NOTICE.md"
          npm run build:native --workspace @rm-industries/browser-oxfmt -- --force
          cmp "$RUNNER_TEMP/first-identity.json" packages/browser-oxfmt/src/generated/identity.json
          cmp "$RUNNER_TEMP/first-NOTICE.md" packages/browser-oxfmt/NOTICE.md
      - name: Check Rust formatting and Clippy
        run: npm run quality:native --workspace @rm-industries/browser-oxfmt
      - name: Verify package contracts
        run: |
          npm run typecheck --workspace @rm-industries/browser-oxfmt
          npm test --workspace @rm-industries/browser-oxfmt
          npm run build --workspace @rm-industries/browser-oxfmt
      - name: Verify packed browsers
        run: |
          npm ci --prefix templates/default --ignore-scripts
          npm exec --prefix templates/default -- playwright install --with-deps chromium firefox webkit
          npm run test:browser --workspace @rm-industries/browser-oxfmt
      - name: Pack and inspect tested candidate
        run: |
          mkdir -p "$RUNNER_TEMP/forge-packages"
          npm pack --ignore-scripts --workspace @rm-industries/browser-oxfmt --pack-destination "$RUNNER_TEMP/forge-packages"
          for entry in dist/index.js dist/index.d.ts dist/build.js dist/build.d.ts dist/worker.js dist/generated/engine.js dist/generated/engine_bg.wasm dist/generated/identity.json NOTICE.md LICENSE; do
            tar -tzf "$RUNNER_TEMP/forge-packages/"*.tgz | grep -Fx "package/$entry"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-oxfmt-package
          path: ${{ runner.temp }}/forge-packages/*.tgz
          if-no-files-found: error
          retention-days: 7
  compatibility:
    name: Runtime (${{ matrix.runtime }})
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum Node 22
            node-version: 22.22.2
          - runtime: latest Node 22
            node-version: 22.x
          - runtime: latest Node 24
            node-version: 24.x
          - runtime: latest Node 26
            node-version: 26.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-oxfmt-package
          path: ${{ runner.temp }}/forge-packages
      - name: Restore verified native assets without Rust
        run: |
          mkdir -p "$RUNNER_TEMP/browser-oxfmt"
          tar -xzf "$RUNNER_TEMP/forge-packages/"*.tgz --strip-components=1 -C "$RUNNER_TEMP/browser-oxfmt"
          cp -R "$RUNNER_TEMP/browser-oxfmt/dist/generated" packages/browser-oxfmt/src/generated
          cp "$RUNNER_TEMP/browser-oxfmt/NOTICE.md" packages/browser-oxfmt/NOTICE.md
      - name: Check package types and unit tests
        run: |
          npm run typecheck --workspace @rm-industries/browser-oxfmt
          npm test --workspace @rm-industries/browser-oxfmt
      - name: Exercise packed entrypoint
        run: |
          mkdir -p "$RUNNER_TEMP/browser-oxfmt-check"
          tar -xzf "$RUNNER_TEMP/forge-packages/"*.tgz --strip-components=1 -C "$RUNNER_TEMP/browser-oxfmt-check"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/browser-oxfmt-check/node_modules"
          node --input-type=module -e 'await import(process.argv[1])' "$RUNNER_TEMP/browser-oxfmt-check/dist/index.js"
