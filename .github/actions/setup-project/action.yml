---
name: Setup Project Dependencies
description: Set up the repository runtime and install locked dependencies

inputs:
  node-version:
    description: Node.js version to install
    required: true
  native:
    description: Install the pinned browser formatter native toolchain
    required: false
    default: 'false'
  working-directory:
    description: Directory containing the package manifest and lockfile
    required: false
    default: .
  cache-dependency-path:
    description: Lockfile used for the npm dependency cache
    required: false
    default: package-lock.json

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Install pinned native build tools
      if: inputs.native == 'true'
      shell: bash
      run: |
        rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown --component rustfmt --component clippy
        cargo +1.97.0 install wasm-bindgen-cli --version "$(node packages/browser-oxfmt/native/build-wasm.ts --bindings-version)" --locked
        echo 'RUSTUP_TOOLCHAIN=1.97.0' >> "$GITHUB_ENV"
