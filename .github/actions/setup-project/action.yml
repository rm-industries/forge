---
name: Setup Project Dependencies
description: Set up the repository runtime and install locked dependencies

inputs:
  node-version:
    description: Node.js version to install
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Setup repository npm version
      run: |
        npm_version=$(node --print "require('./package.json').packageManager.split('@').at(-1)")
        npm install --global "npm@${npm_version}"
        npm --version
      shell: bash

    - name: Install dependencies
      run: npm ci
      shell: bash
