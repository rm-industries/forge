name: Select CI impact
description: Conservatively select validation from the complete changed path set
outputs:
  project:
    description: Package and root execution required
    value: ${{ steps.select.outputs.project }}
  generator:
    description: Generator execution required
    value: ${{ steps.select.outputs.generator }}
  website:
    description: Website execution required
    value: ${{ steps.select.outputs.website }}
  packages:
    description: Selected local package workspace slugs
    value: ${{ steps.select.outputs.packages }}
  native:
    description: Native Rust quality required
    value: ${{ steps.select.outputs.native }}
  frontmatterCandidate:
    description: Candidate model and frontmatter CMS integration required
    value: ${{ steps.select.outputs.frontmatterCandidate }}
  browserCandidate:
    description: Candidate packed browser and serialization required
    value: ${{ steps.select.outputs.browserCandidate }}
  website-full-browsers:
    description: Full website browser matrix required
    value: ${{ steps.select.outputs.websiteFullBrowsers }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.x
    - id: select
      shell: bash
      run: node scripts/ci-impact.ts
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
