[package]
name = "forge-browser-oxfmt"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "2bd08ebe8f36fcf1954a675ffdeb4c6d0129f609" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc.git", rev = "2bd08ebe8f36fcf1954a675ffdeb4c6d0129f609" }
oxc_formatter_markdown = { git = "https://github.com/oxc-project/oxc.git", rev = "2bd08ebe8f36fcf1954a675ffdeb4c6d0129f609" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxc_formatter_yaml = { git = "https://github.com/oxc-project/oxc.git", rev = "2bd08ebe8f36fcf1954a675ffdeb4c6d0129f609" }
oxc_formatter_css = { git = "https://github.com/oxc-project/oxc.git", rev = "2bd08ebe8f36fcf1954a675ffdeb4c6d0129f609" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc.git", rev = "2bd08ebe8f36fcf1954a675ffdeb4c6d0129f609" }
oxc_span = { git = "https://github.com/oxc-project/oxc.git", rev = "2bd08ebe8f36fcf1954a675ffdeb4c6d0129f609" }
wasm-bindgen = "=0.2.114"
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
[patch.crates-io]
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "2bd08ebe8f36fcf1954a675ffdeb4c6d0129f609" }
