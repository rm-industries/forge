[package]
name = "forge-browser-oxfmt"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
oxc_allocator = { path = ".upstream/crates/oxc_allocator" }
oxc_formatter_core = { path = ".upstream/crates/oxc_formatter_core" }
oxc_formatter_markdown = { path = ".upstream/crates/oxc_formatter_markdown" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxc_formatter_yaml = { path = ".upstream/crates/oxc_formatter_yaml" }
oxc_formatter_css = { path = ".upstream/crates/oxc_formatter_css" }
oxc_formatter = { path = ".upstream/crates/oxc_formatter" }
oxc_span = { path = ".upstream/crates/oxc_span" }
wasm-bindgen = "=0.2.114"
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
[patch.crates-io]
oxc_allocator = { path = ".upstream/crates/oxc_allocator" }
