[package]
name = "oxfmt-markdown-wasm-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["raw-abi"]
raw-abi = []

[dependencies]
oxc_allocator = { path = "../source/crates/oxc_allocator" }
oxc_formatter_core = { path = "../source/crates/oxc_formatter_core" }
oxc_formatter_markdown = { path = "../source/crates/oxc_formatter_markdown" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

oxc_formatter_yaml = { path = "../source/crates/oxc_formatter_yaml" }

oxc_formatter_css = { path = "../source/crates/oxc_formatter_css" }

oxc_formatter = { path = "../source/crates/oxc_formatter" }

oxc_span = { path = "../source/crates/oxc_span" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[patch.crates-io]
oxc_allocator = { path = "../source/crates/oxc_allocator" }
